<!DOCTYPE html>
<html>

<head>
    <title>CCPD Event Check-In</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <strong>Rhodes CCPD</strong>
</header>

<section class="container">

    <div class="card">

        <h1>Career Event Check-In</h1>

        <form id="checkinForm">

            <label>Your Name</label><br>
            <input
                type="text"
                id="studentName"
                required
            >

            <br><br>

            <label>Rhodes Email</label><br>
            <input
                type="email"
                id="email"
                required
            >

            <br><br>

            <label>Who referred you to this event?</label><br>
            <input
                type="text"
                id="ambassador"
                placeholder="Enter their name"
                required
            >

            <br><br>

            <label>Event</label><br>

            <select id="event" required>

                <option value="">
                    Select an event
                </option>

                <option>
                    Internship Information Day
                </option>

                <option>
                    Professionalism 101
                </option>

                <option>
                    Career Ready Resumes
                </option>

                <option>
                    Mock Interview Day with Employers
                </option>

                <option>
                    STEM Connections: Networking & Recruitig Event
                </option>

                <option>
                    Creative Careers Connection Fair: Networking and Recruiting Event
                </option>

            </select>

            <br><br>

            <button type="submit">
                Check In
            </button>

        </form>

        <p id="message"></p>

    </div>

</section>

<script src="script.js"></script>

</body>

</html>
